name: release

# Tag-driven release. Pushing v*.*.* verifies the payload and, only if every check
# passes, publishes a GitHub Release. Zenodo's repository webhook fires on the
# published release and mints the version DOI — it ignores drafts, so the release is
# published directly.
#
# The verifier is the point of this workflow. A tag must not be able to publish a
# payload that leaks withheld prose, has drifted from its expected counts, or is
# missing the audit artefacts the datasheet refers to.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify only; do not create a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Data artefacts are in Git LFS. Without this the runner holds pointer stubs and
          # the guard below fires on a false alarm instead of on a real one.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet "pandas>=2.0" "pyarrow>=14"

      - name: Confirm no Git LFS pointers in the checkout
        # First half: the working tree the verifier is about to read.
        run: |
          if find data -type f -size -1k | xargs -r grep -l "git-lfs.github.com/spec" 2>/dev/null | grep .; then
            echo "::error::LFS pointer files in the checkout. Is 'lfs: true' set on actions/checkout?"
            exit 1
          fi
          echo "checkout: no LFS pointers"

      - name: Confirm the ZIPBALL carries real LFS content
        # Second half, and the one that actually protects the published record.
        #
        # Zenodo archives the GitHub zipball, and GitHub omits LFS content from source
        # archives BY DEFAULT -- the repository setting
        #   Settings -> General -> Archives -> [x] Include Git LFS objects in archives
        # must be ON. If it is off, the checkout above is clean and the Zenodo record still
        # fills with 130-byte pointer stubs. Testing the checkout alone would pass while the
        # thing being published is broken, so the zipball itself is downloaded and inspected.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          [ "$REF" = "$GITHUB_REF" ] && REF="${GITHUB_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/zipball/${REF}" > archive.zip
          mkdir -p _zip && unzip -q archive.zip -d _zip
          if find _zip -type f -name '*.parquet' -size -1k | head -1 | grep .; then
            echo "::error::The source archive contains LFS POINTERS, not data. Enable \
          'Include Git LFS objects in archives' in the repository settings (Settings -> \
          General -> Archives). Zenodo would otherwise archive 130-byte stubs."
            find _zip -type f -name '*.parquet' -size -1k | head -5
            exit 1
          fi
          echo "zipball: LFS objects included — safe for Zenodo"
          rm -rf _zip archive.zip

      - name: Verify release
        run: python scripts/verify_release.py --strict-checksums

      - name: Confirm tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          DECLARED=$(python -c "import sys; sys.path.insert(0,'scripts'); import release_config as c; print(c.DATASET_VERSION)")
          if [ "$TAG" != "$DECLARED" ]; then
            echo "::error::tag v$TAG does not match DATASET_VERSION $DECLARED in scripts/release_config.py"
            exit 1
          fi
          CFF=$(grep -E '^version:' CITATION.cff | awk '{print $2}')
          if [ "$TAG" != "$CFF" ]; then
            echo "::error::tag v$TAG does not match version $CFF in CITATION.cff"
            exit 1
          fi
          echo "version consistent across tag, release_config.py and CITATION.cff"

      - name: Summarise payload
        run: |
          {
            echo "### Release payload"
            echo ""
            echo "| directory | files | size |"
            echo "|---|---:|---:|"
            for d in data/corpus data/kg data/enrichment data/benchmark data/synthetic_interactions docs; do
              echo "| \`$d\` | $(find $d -type f | wc -l) | $(du -sh $d | cut -f1) |"
            done
            echo ""
            # `du -sh` prints human-readable sizes; summing those with awk yields an
            # empty line. `du -ch` already computes the total, so use it directly.
            echo "Total: $(du -ch data docs | tail -1 | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes for this tag
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Pull the section for this version out of CHANGELOG.md, if present.
          awk -v tag="${TAG#v}" '
            $0 ~ "^## \\[" tag "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry for $TAG." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        # Published, not draft: Zenodo's webhook only archives published releases.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "IndicRecipeNutri $TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
